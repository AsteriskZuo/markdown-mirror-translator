<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Markdown Mirror Translator icon</title>
  <desc id="desc">Two mirrored Markdown documents with translation arrows between them.</desc>
  <defs>
    <linearGradient id="bg" x1="14" y1="8" x2="114" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#253047"/>
      <stop offset="0.58" stop-color="#193b4f"/>
      <stop offset="1" stop-color="#17433f"/>
    </linearGradient>
    <linearGradient id="leftSheet" x1="24" y1="23" x2="61" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#d9e9f6"/>
    </linearGradient>
    <linearGradient id="rightSheet" x1="67" y1="23" x2="104" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9fffb"/>
      <stop offset="1" stop-color="#d7f0e6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#061018" flood-opacity="0.36"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#061018" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="22" fill="url(#bg)"/>
  <path d="M19 93C36 82 48 103 64 91C80 79 93 95 109 83" fill="none" stroke="#5dd6bb" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
  <path d="M18 35C34 46 47 23 64 36C81 49 96 31 110 44" fill="none" stroke="#73b7ff" stroke-width="4" stroke-linecap="round" opacity="0.28"/>

  <g filter="url(#shadow)" transform="translate(-5 0)">
    <path d="M25 24h34l10 10v69H25z" fill="url(#leftSheet)"/>
    <path d="M59 24v10h10z" fill="#bad5e8"/>
    <path d="M25 24h34l10 10v69H25z" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
  </g>

  <g filter="url(#shadow)" transform="translate(-5 0)">
    <path d="M69 24h34l10 10v69H69z" fill="url(#rightSheet)"/>
    <path d="M103 24v10h10z" fill="#b9dfd1"/>
    <path d="M69 24h34l10 10v69H69z" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(-5 0)">
    <path d="M39 43h17" stroke="#1e4d69" stroke-width="4"/>
    <path d="M37 43v25" stroke="#1e4d69" stroke-width="4"/>
    <path d="M57 43v25" stroke="#1e4d69" stroke-width="4"/>
    <path d="M37 69l7-10 6 8 7-13 7 15" stroke="#1e4d69" stroke-width="4"/>
    <path d="M34 82h23" stroke="#5f7f94" stroke-width="4"/>
    <path d="M34 91h17" stroke="#7a96a8" stroke-width="4"/>
  </g>

  <text x="86" y="78" fill="#17614f" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="42" font-weight="800" text-anchor="middle">译</text>
  <g fill="none" stroke="#68a08c" stroke-width="4" stroke-linecap="round">
    <path d="M76 91h22"/>
  </g>

  <g filter="url(#softShadow)">
    <circle cx="64" cy="64" r="17" fill="#10212d" opacity="0.92"/>
    <path d="M55 58h17" fill="none" stroke="#6ee7c7" stroke-width="5" stroke-linecap="round"/>
    <path d="M67 52l7 6-7 6" fill="none" stroke="#6ee7c7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M73 70H56" fill="none" stroke="#78bfff" stroke-width="5" stroke-linecap="round"/>
    <path d="M61 64l-7 6 7 6" fill="none" stroke="#78bfff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
